name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchains
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true

      - name: Install npm dependencies
        run: npm ci

      # Installed here only, so the release and native-binary jobs do not
      # download a tool they do not use.
      - name: Lint GitHub Actions workflows
        run: mise exec aqua:rhysd/actionlint@1.7.12 -- actionlint

      - name: Check third-party actions are pinned to commit SHAs
        run: |
          if grep -nE '^\s*(-\s*)?uses:\s*[^.][^@]*@' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}(\s|$)'; then
            echo "Pin the actions above to a full commit SHA." >&2
            exit 1
          fi

      - name: Check Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Run checks
        run: npm run check

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Check Python package build
        run: |
          python -m pip install --upgrade build
          npm run python:build

      - name: Check Rust crate package
        run: cargo publish -p agenthint --dry-run

  portability:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchains
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true

      - name: Install npm dependencies
        run: npm ci

      - name: Run JavaScript and Rust tests
        run: |
          npm run test
          npm run rust:test

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: PYTHONPATH=python python -m unittest discover -s test -p 'python_test.py'
