name: Native Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to upload assets to
        required: true
  # release.yml calls this after release-please creates a release. Releases
  # created with GITHUB_TOKEN do not trigger the `release` event below.
  workflow_call:
    inputs:
      tag:
        description: GitHub release tag to upload assets to
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: native-binaries-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: ${{ startsWith(inputs.tag || github.event.release.tag_name, 'agenthint-v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            binary: agenthint
            asset: agenthint-linux-x64
            target: ""
          - name: linux-arm64
            os: ubuntu-24.04-arm
            binary: agenthint
            asset: agenthint-linux-arm64
            target: ""
          - name: macos-arm64
            os: macos-latest
            binary: agenthint
            asset: agenthint-macos-arm64
            target: ""
          - name: macos-x64
            os: macos-latest
            binary: agenthint
            asset: agenthint-macos-x64
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            binary: agenthint.exe
            asset: agenthint-windows-x64.exe
            target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the tagged source, not the commit that started this run.
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install toolchains
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true

      - name: Build Rust CLI
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add "${{ matrix.target }}"
            cargo build --release -p agenthint --target "${{ matrix.target }}"
          else
            cargo build --release -p agenthint
          fi

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.target }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          else
            cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          fi
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          elif command -v powershell.exe >/dev/null 2>&1; then
            powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 '${{ matrix.asset }}').Hash.ToLower() + '  ${{ matrix.asset }}'" > "${{ matrix.asset }}.sha256"
          else
            echo "No SHA256 tool found" >&2
            exit 1
          fi
          sed -i.bak 's/ \*/  /' "${{ matrix.asset }}.sha256"
          rm -f "${{ matrix.asset }}.sha256.bak"

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload checksum artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksum-${{ matrix.name }}
          path: dist/${{ matrix.asset }}.sha256

  checksums:
    name: Publish SHA256SUMS
    if: ${{ startsWith(inputs.tag || github.event.release.tag_name, 'agenthint-v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download checksum artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums

      - name: Build SHA256SUMS
        shell: bash
        run: |
          sort checksums/*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
