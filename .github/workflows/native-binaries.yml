name: Native Binaries

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            binary: agenthint
            asset: agenthint-linux-x64
          - name: macos-arm64
            os: macos-latest
            binary: agenthint
            asset: agenthint-macos-arm64
          - name: macos-x64
            os: macos-13
            binary: agenthint
            asset: agenthint-macos-x64
          - name: windows-x64
            os: windows-latest
            binary: agenthint.exe
            asset: agenthint-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchains
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Build Rust CLI
        run: cargo build --release -p agenthint

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
