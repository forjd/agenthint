name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchains
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install npm dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Check Rust crate package
        run: cargo publish -p agenthint --dry-run
