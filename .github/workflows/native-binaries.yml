name: Native Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to upload assets to
        required: true
  release:
    types:
      - published

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'agenthint-v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            binary: agenthint
            asset: agenthint-linux-x64
          - name: macos-arm64
            os: macos-latest
            binary: agenthint
            asset: agenthint-macos-arm64
          - name: macos-x64
            os: macos-13
            binary: agenthint
            asset: agenthint-macos-x64
          - name: windows-x64
            os: windows-latest
            binary: agenthint.exe
            asset: agenthint-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchains
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Build Rust CLI
        run: cargo build --release -p agenthint

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          elif command -v powershell.exe >/dev/null 2>&1; then
            powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 '${{ matrix.asset }}').Hash.ToLower() + '  ${{ matrix.asset }}'" > "${{ matrix.asset }}.sha256"
          else
            echo "No SHA256 tool found" >&2
            exit 1
          fi

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.name }}
          path: dist/${{ matrix.asset }}.sha256

  checksums:
    name: Publish SHA256SUMS
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'agenthint-v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download checksum artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums

      - name: Build SHA256SUMS
        shell: bash
        run: |
          sort checksums/*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
