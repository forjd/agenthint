name: Native Binaries

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            binary: agenthint
            asset: agenthint-linux-x64
          - name: macos-arm64
            os: macos-latest
            binary: agenthint
            asset: agenthint-macos-arm64
          - name: macos-x64
            os: macos-13
            binary: agenthint
            asset: agenthint-macos-x64
          - name: windows-x64
            os: windows-latest
            binary: agenthint.exe
            asset: agenthint-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchains
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Build Rust CLI
        run: cargo build --release -p agenthint

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          cd dist
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.name }}
          path: dist/${{ matrix.asset }}.sha256

  checksums:
    name: Publish SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download checksum artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums

      - name: Build SHA256SUMS
        run: |
          sort checksums/*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" SHA256SUMS --clobber
